name: Prepare Layero static branch
on:
  push:
    branches: [layero-deploy]
    paths:
      - '.github/workflows/prepare-layero.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy static site into repository root
        run: |
          test -f proneyo-source/dist/index.html
          cp -a proneyo-source/dist/. .
          test -f index.html
          test -f robots.txt
          test -f sitemap.xml
      - name: Commit prepared files to layero-deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Prepare static site at repository root for Layero"
            git push origin HEAD:layero-deploy
          fi
